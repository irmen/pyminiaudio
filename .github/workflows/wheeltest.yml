name: CI build wheels

# Build on every checkin
on: [push, pull_request]
 
jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-26.04-arm
            architectures: auto armv7l
          - os: windows-latest
          - os: windows-11-arm
          - os: macos-latest # arm64
          - os: macos-26-intel

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        name: Install Python
        with:
          python-version: '3.14'

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.4
        env:
        # I can't get windows tests to work, but at least here's linux testing the built wheels
          CIBW_TEST_REQUIRES: pytest
          CIBW_ARCHS: ${{ matrix.architectures || 'auto' }}
          CIBW_ARCHS_MACOS: 'x86_64 arm64'
          CIBW_BUILD: 'cp310-* cp311-* cp312-* cp313-* cp314-*'
          CIBW_TEST_COMMAND_LINUX: "cd {project} && pytest -v tests/"


      - uses: actions/upload-artifact@v7
        with:
          name: pypi_artifacts on ${{ matrix.os }}
          path: ./wheelhouse/*.whl

